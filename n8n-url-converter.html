<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n8n URL Konverter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    h1 { font-size: 1.3rem; color: #1a1a1a; margin-bottom: 6px; }
    p { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 6px; }
    textarea {
      width: 100%;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      font-family: monospace;
      resize: vertical;
      min-height: 80px;
      color: #1a1a1a;
      transition: border-color 0.2s;
    }
    textarea:focus { outline: none; border-color: #ff6d5a; }
    .result-box {
      position: relative;
      margin-top: 20px;
    }
    .result {
      width: 100%;
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      border-radius: 8px;
      padding: 12px 44px 12px 12px;
      font-size: 0.85rem;
      font-family: monospace;
      color: #166534;
      word-break: break-all;
      min-height: 80px;
    }
    .result.error {
      background: #fff7ed;
      border-color: #fdba74;
      color: #9a3412;
    }
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .copy-btn:hover { background: #16a34a; }
    .copy-btn.copied { background: #64748b; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      margin-bottom: 6px;
    }
    .badge.test { background: #fef9c3; color: #854d0e; }
    .badge.prod  { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
  <div class="card">
    <h1>n8n URL Konverter</h1>
    <p>Indsæt URL'en fra n8n editoren — få den korrekte webhook-URL tilbage.</p>

    <label for="input">URL fra n8n editor</label>
    <textarea id="input" placeholder="https://n8n.xmemory.com/api/hassio_ingress/.../webhook-test/..." spellcheck="false"></textarea>

    <div class="result-box" id="resultBox" style="display:none">
      <div id="badge" class="badge"></div>
      <div class="result" id="result"></div>
      <button class="copy-btn" id="copyBtn" onclick="copy()">Kopiér</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const resultBox = document.getElementById('resultBox');
    const resultEl = document.getElementById('result');
    const badgeEl = document.getElementById('badge');
    const copyBtn = document.getElementById('copyBtn');

    const INGRESS_PATTERN = /^https?:\/\/[^/]+\/api\/hassio_ingress\/[^/]+(\/.*)?$/;
    const HOOKS_BASE = 'https://n8n-hooks.xmemory.com';

    input.addEventListener('input', convert);

    function convert() {
      const raw = input.value.trim();
      if (!raw) { resultBox.style.display = 'none'; return; }

      resultBox.style.display = 'block';
      copyBtn.classList.remove('copied');
      copyBtn.textContent = 'Kopiér';

      if (!INGRESS_PATTERN.test(raw)) {
        resultEl.className = 'result error';
        resultEl.textContent = 'Ikke en gyldig n8n Ingress-URL. Forventet format: https://n8n.xmemory.com/api/hassio_ingress/[token]/webhook...';
        badgeEl.style.display = 'none';
        copyBtn.style.display = 'none';
        return;
      }

      // Extract everything after the ingress token
      const afterIngress = raw.replace(/^https?:\/\/[^/]+\/api\/hassio_ingress\/[^/]+/, '');
      const converted = HOOKS_BASE + (afterIngress || '/');

      const isTest = converted.includes('/webhook-test/');
      badgeEl.style.display = 'inline-block';
      badgeEl.className = 'badge ' + (isTest ? 'test' : 'prod');
      badgeEl.textContent = isTest ? 'TEST — kun aktiv mens du lytter i editoren' : 'PRODUKTION — aktiv når workflow er slået til';

      resultEl.className = 'result';
      resultEl.textContent = converted;
      copyBtn.style.display = 'block';
    }

    function copy() {
      navigator.clipboard.writeText(resultEl.textContent).then(() => {
        copyBtn.textContent = 'Kopieret!';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = 'Kopiér'; copyBtn.classList.remove('copied'); }, 2000);
      });
    }
  </script>
</body>
</html>
